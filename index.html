:#5149bf;border-radius:99px;font-size:10px;font-weight:800}.card h4{margin:10px 0 5px;font-size:16px}.card p{margin:0;color:#697588;font-size:13px;line-height:1.4;white-space:pre-wrap}.bar{height:6px;background:#eef0f5;border-radius:99px;margin:13px 0 7px;overflow:hidden}.bar i{display:block;height:100%;background:#5e58d8}.foot{display:flex;justify-content:space-between;color:#718096;font-size:11px}.empty{background:white;border-radius:14px;text-align:center;padding:34px;color:#718096}.modal{position:fixed;inset:0;display:none;align-items:end;justify-content:center;padding:14px;background:#17213a88;z-index:5}.modal.open{display:flex}.sheet{width:min(560px,100%);max-height:92vh;overflow:auto;background:white;padding:18px;border-radius:19px}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheet h3{margin:0}.close{width:32px;height:32px;border:0;border-radius:9px;background:#eef1f6;font-size:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}label{font-size:12px;font-weight:750;color:#556176}input,select,textarea{border:1px solid #dce1ea;border-radius:9px;padding:10px;font:inherit}textarea{min-height:75px}.sheetactions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.danger{color:#b4233d;border-color:#ffc9d4}@media(max-width:560px){.brand p{display:none}.form{grid-template-columns:1fr}.full{grid-column:auto}.stat{padding:10px}.search{width:140px}}</style><body><main><header class="top"><div class="brand"><div class="logo">✦</div><div><h1>Central de Planos</h1><p>Organize o que importa, sem complicar.</p></div></div><div><button class="primary" id="newBtn">+ Projeto</button></div></header><nav class="tabs" id="tabs"></nav><section class="hero"><small id="heroTag">VISÃO GERAL</small><h2 id="heroTitle">Seus planos, no mesmo lugar.</h2><p>Com o backup ativo, seus planos também ficam protegidos no cofre privado.</p></section><section class="stats"><div class="stat"><span>Ativos</span><b id="activeCount">0</b></div><div class="stat"><span>Concluídos</span><b id="doneCount">0</b></div><div class="stat"><span>Alta prioridade</span><b id="highCount">0</b></div></section><div class="head"><h3 id="sectionTitle">Todos os projetos</h3><input class="search" id="search" placeholder="Buscar plano"></div><section class="grid" id="grid"></section></main><div class="modal" id="modal"><div class="sheet"><div class="sheethead"><h3 id="modalTitle">Novo projeto</h3><button class="close" id="closeBtn">×</button></div><form id="projectForm"><input id="projectId" type="hidden"><div class="form"><div class="field full"><label>Nome do projeto</label><input id="projectName" required></div><div class="field"><label>Área</label><select id="projectArea"><option value="family">Família</option><option value="invest">Investimentos</option><option value="work">Trabalho</option><option value="health">Saúde</option><option value="dream">Grandes conquistas</option></select></div><div class="field"><label>Status</label><select id="projectStatus"><option value="active">Em andamento</option><option value="paused">Pausado</option><option value="done">Concluído</option></select></div><div class="field"><label>Prioridade</label><select id="projectPriority"><option value="high">Alta</option><option value="medium">Média</option><option value="low">Baixa</option></select></div><div class="field"><label>Prazo</label><input id="projectDeadline" type="date"></div><div class="field full"><label>Próximo passo ou observação</label><textarea id="projectDesc"></textarea></div><div class="field full"><label>Progresso: <span id="progressLabel">0%</span></label><input id="projectProgress" type="range" min="0" max="100" value="0"></div></div><div class="sheetactions"><button type="button" class="secondary danger" id="removeBtn">Excluir</button><button type="button" class="secondary" id="cancelBtn">Cancelar</button><button class="primary">Salvar projeto</button></div></form></div></div><script>const $=s=>document.querySelector(s),K="central-planos-v1",A={all:["Todos","◈"],family:["Família","♥"],invest:["Investimentos","↗"],work:["Trabalho","▣"],health:["Saúde","✚"],dream:["Grandes conquistas","✦"]};let tab="all",projects=[];try{projects=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){}function esc(s){return String(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}function save(){localStorage.setItem(K,JSON.stringify(projects))}function fmt(d){return d?d.split("-").reverse().join("/"):"Sem prazo"}function tabs(){$("#tabs").innerHTML=Object.entries(A).map(x=>"<button class=\"tab "+(x[0]===tab?"on":"")+"\" data-k=\""+x[0]+"\">"+x[1][1]+" "+x[1][0]+"</button>").join("");document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{tab=b.dataset.k;draw()})}function draw(){tabs();let q=$("#search").value.toLowerCase(),list=projects.filter(p=>(tab==="all"||p.area===tab)&&((p.name+" "+p.desc).toLowerCase().includes(q)));let title=tab==="all"?"Todos os projetos":A[tab][0];$("#sectionTitle").textContent=title;$("#heroTag").textContent=tab==="all"?"VISÃO GERAL":title.toUpperCase();$("#heroTitle").textContent=tab==="all"?"Seus planos, no mesmo lugar.":title+" em foco.";$("#grid").innerHTML=list.length?list.map(p=>"<article class=\"card\" data-id=\""+p.id+"\"><span class=\"badge\">"+(A[p.area]||A.all)[1]+" "+(A[p.area]||A.all)[0]+"</span><h4>"+esc(p.name)+"</h4><p>"+esc(p.desc||"Sem próximo passo definido.")+"</p><div class=\"bar\"><i style=\"width:"+(+p.progress||0)+"%\"></i></div><div class=\"foot\"><span>"+(+p.progress||0)+"% concluído</span><span>"+fmt(p.deadline)+"</span></div></article>").join(""):"<div class=\"empty\">Nenhum projeto aqui ainda.<br>Toque em <b>+ Projeto</b> para criar o primeiro.</div>";document.querySelectorAll("[data-id]").forEach(c=>c.onclick=()=>edit(c.dataset.id));$("#activeCount").textContent=projects.filter(p=>p.status==="active").length;$("#doneCount").textContent=projects.filter(p=>p.status==="done").length;$("#highCount").textContent=projects.filter(p=>p.priority==="high"&&p.status!=="done").length}function openNew(){$("#modalTitle").textContent="Novo projeto";$("#projectForm").reset();$("#projectId").value="";$("#projectArea").value=tab==="all"?"family":tab;$("#projectProgress").value=0;$("#progressLabel").textContent="0%";$("#removeBtn").style.display="none";$("#modal").classList.add("open")}function edit(id){let p=projects.find(x=>x.id===id);if(!p)return;$("#modalTitle").textContent="Editar projeto";$("#projectId").value=p.id;$("#projectName").value=p.name||"";$("#projectArea").value=p.area||"family";$("#projectStatus").value=p.status||"active";$("#projectPriority").value=p.priority||"medium";$("#projectDeadline").value=p.deadline||"";$("#projectDesc").value=p.desc||"";$("#projectProgress").value=p.progress||0;$("#progressLabel").textContent=(p.progress||0)+"%";$("#removeBtn").style.display="block";$("#modal").classList.add("open")}function close(){$("#modal").classList.remove("open")}$("#newBtn").onclick=openNew;$("#closeBtn").onclick=close;$("#cancelBtn").onclick=close;$("#search").oninput=draw;$("#projectProgress").oninput=e=>$("#progressLabel").textContent=e.target.value+"%";$("#projectForm").onsubmit=e=>{e.preventDefault();let id=$("#projectId").value,p={id:id||String(Date.now()),name:$("#projectName").value.trim(),area:$("#projectArea").value,status:$("#projectStatus").value,priority:$("#projectPriority").value,deadline:$("#projectDeadline").value,desc:$("#projectDesc").value.trim(),progress:+$("#projectProgress").value};if(p.status==="done")p.progress=100;let i=projects.findIndex(x=>x.id===id);if(i<0)projects.unshift(p);else projects[i]=p;save();close();draw()};$("#removeBtn").onclick=()=>{projects=projects.filter(p=>p.id!==$("#projectId").value);save();close();draw()};draw()</script><script src="https://raw.githack.com/pedrogomesferreira1912-lgtm/central-de-planos/main/backup.js?v=7"></script></body></html>
